name: Publish signed APK
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'kmab5/singalong'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate tag and main-branch ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python3 tools/release_version.py check --tag "$RELEASE_TAG"
          python3 tools/check_docs.py
          python3 -m unittest discover -s tools -p 'test_*.py'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Restore existing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tools/prepare_ci_signing.py
      - name: Verify and assemble release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --console=plain
      - name: Verify signing continuity and prepare artifacts
        run: python3 tools/package_release.py
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace its APK."
            exit 1
          fi
          args=()
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --title "Singalong $RELEASE_TAG" --notes-file RELEASE_NOTES.md "${args[@]}"
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/singalong-release.jks"
